  DESCRIPTION:
    Description: |
      <h2>Stormglass Requiem</h2>
      <p><em>Weapon (glaive), legendary; requires attunement by a creature proficient with martial weapons.</em></p>
      <p>A silver-edged blade of smoky glass traps a miniature thunderstorm. You gain a +2 bonus to attack and damage rolls made with this magic weapon. It deals 1d10 slashing damage, has a reach of 10 feet, and has the Heavy, Reach, Two-Handed, and Silvered properties. Its mastery property is Graze.</p>
      <h3>Resonant Rend</h3>
      <p>As an action, expend one use of this activity to make a melee attack with the glaive. It has uses equal to your proficiency bonus and regains all expended uses when you finish a long rest.</p>
      <p>On a hit, deal the weapon's normal damage plus 1d6 lightning and 1d6 thunder damage. This attack scores a critical hit on a 19 or 20 and adds an extra 1d6 to its critical damage.</p>
      <p>The target suffers Resonant Shackles for 1 round, expiring at the end of its turn: it is Deafened, and its walking, climbing, and swimming speeds are halved.</p>
      <h3>Tempest Unbound</h3>
      <p>As an action, expend one charge of this activity to release a cone whose length in feet is 15 + five times your proficiency bonus. This activity has four charges and regains all expended charges at dawn.</p>
      <p>Each creature in the cone makes a Constitution saving throw against DC 8 + your proficiency bonus + your Strength modifier. A creature takes 3d8 lightning and 3d8 thunder damage on a failed save, or half as much damage on a successful save.</p>
      <p>You may expend up to three additional charges. Each additional charge adds 1d8 lightning and 1d8 thunder damage.</p>
      <p>A creature that fails the save also suffers Storm-Sundered for 1 round, expiring at the end of its turn: it is Blinded and Deafened, its flying speed becomes 0, and it cannot hover.</p>
