  DESCRIPTION:
    Description: |
      <p><strong>General Feat (Prerequisite: Level 4+)</strong></p>
      <p>You gain the following benefits.</p>
      <p><strong>Ability Score Increase.</strong> Increase your Constitution score by 1, to a maximum of 20.</p>
      <p><strong>Storm Spells.</strong> You always have the Thunderwave and Gust of Wind spells prepared. You can
      cast each of them once without expending a spell slot, and you regain the ability to do so when you finish
      a Long Rest. Charisma is your spellcasting ability for these spells.</p>
      <p><strong>Weathered.</strong> You gain proficiency in the Athletics skill.</p>
      <p><strong>Storm Dice.</strong> You have a storm die, a d6. Once per turn when you hit with an attack roll,
      you can roll the die and add the result as thunder damage. At level 12 you roll two dice instead.</p>
  CHAT_FLAVOR:
