  DESCRIPTION:
    Description: |
      <p><strong>Weapon (longsword), very rare (requires attunement)</strong></p>
      <p>Blue-white lightning coils beneath the surface of this dark steel blade.
      You gain a +2 bonus to attack and damage rolls made with this magic weapon.
      Each hit deals an additional 1d6 lightning damage. While equipped and attuned,
      its Stormward grants you a +1 bonus to AC.</p>
      <p><strong>Charges.</strong> The sword has 6 charges and regains all expended
      charges when you finish a long rest. Its abilities share this pool.</p>
      <p><strong>Stormsteel Strike.</strong> Make one attack with the sword,
      dealing its normal weapon damage plus 1d6 lightning damage on a hit.</p>
      <p><strong>Thunderous Strike (1 charge).</strong> As an action, expend
      1 charge and make one attack with the sword. On a hit, it deals its normal
      damage plus 1d6 lightning and 2d6 thunder damage. The creature hit must
      also succeed on a DC 15 Strength saving throw or fall prone. This save is
      handled by the hidden Storm Impact follow-up activity. A creature can
      end the prone condition by standing normally.</p>
      <p><strong>Call the Storm (2 charges).</strong> As an action, expend
      2 charges and choose a point within 60 feet. Hostile creatures in a
      15-foot-radius sphere centered there make a DC 15 Dexterity saving throw,
      taking 4d6 lightning damage on a failed save, or half as much on a success.</p>
      <p><strong>Stormguard (1 charge).</strong> As a bonus action, expend
      1 charge to gain 2d6 + 4 temporary hit points. These follow the normal
      temporary hit point rules and do not stack with existing temporary hit points.</p>
  UNIDENTIFIED_DESCRIPTION:
    Unidentified Name: Storm-Etched Longsword
    Unidentified Description: |
      <p>A dark longsword etched with branching silver lines.
      Its pommel hums quietly before a thunderstorm.</p>
